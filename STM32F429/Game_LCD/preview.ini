; PCFbView 项目配置
;
; 模拟器打开这个文件夹时：
;   1. 先找 dll= 指定的文件
;   2. 找不到就按 sources= 用 gcc 现场编一个适配器 DLL
;      （编到本目录 _fbview\adapter.dll，之后就直接加载，不再重复编译）
;
; 删掉本目录 _fbview 文件夹即可强制重新编译。

width=800
height=480
fps=30
title=Tilt Game (PC preview)

dll=game_adapter.dll

; 相对本目录；逗号分隔
sources=User\game\preview_adapter.c,User\game\pc_bsp_lcd.c,User\game\game.c,User\game\app.c,User\game\render.c

; 额外的 -I（相对本目录）。PCFbView 的头文件路径由宿主自己补，不用写这里
includes=User\game

; 额外的 -D
defines=PC_PREVIEW
