; Template_LCD 项目配置
;
; 用 EmbeddedScreenPreview 打开本文件夹时：
;   1. 先找 dll= 指定的文件
;   2. 找不到就按 sources= 用 gcc 现场编一个适配器 DLL
;      （编到本目录 _fbview\adapter.dll，之后直接加载，不重复编译）
;
; 删掉本目录 _fbview 文件夹即可强制重新编译。

width=800
height=480
fps=30
title=Template_LCD

dll=template_adapter.dll

; 相对本目录，逗号分隔
sources=User\gfx\preview_adapter.c,User\gfx\pc_bsp_lcd.c,User\gfx\gfx.c,User\demo\demo_scene.c

; 额外的 -I（相对本目录）。预览器自己的头文件路径由宿主补，不用写这里
includes=User\gfx,User\demo

; 额外的 -D
defines=PC_PREVIEW
